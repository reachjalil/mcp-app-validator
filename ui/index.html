<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP App Validator · local</title><style>
body{font:16px system-ui;margin:0;background:#f6f7f9;color:#20242c}main{max-width:1100px;margin:auto;padding:30px}h1{font-size:28px}input,textarea,button,select{font:inherit;padding:10px;border:1px solid #cbd1da;border-radius:6px}input,textarea,select{max-width:100%;box-sizing:border-box}input{width:min(700px,100%)}button{cursor:pointer;background:white}button.primary{background:#20242c;color:white}textarea{width:100%;height:130px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}section{background:white;padding:20px;margin:16px 0;border:1px solid #dfe3e9;border-radius:8px}article{border-top:1px solid #ddd;padding:12px 0}iframe{width:100%;height:420px;border:1px solid #ddd}small{color:#596575}nav{display:flex;gap:8px;flex-wrap:wrap}a{color:#2456ae}.row{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.grid{display:block}}
</style></head><body><main><small>HelloMCP · local, open source</small><h1>MCP App Validator</h1><p>Inspect a server, exercise its tools, and observe its Apps.</p><form id="connect"><div class="row"><input id="url" type="url" placeholder="https://example.com/mcp" required aria-label="MCP URL"><button class="primary">Inspect server</button></div></form><p id="status" role="status">Discovery does not call tools. Each tool call is reviewed.</p><section id="workspace" hidden><nav><button data-view="inventory">Inventory</button><button data-view="findings">Findings</button><button data-view="trace">Trace</button></nav><div id="inventory"><h2>Tools</h2><select id="tools" aria-label="Tool"></select><pre id="schema"></pre><label>Arguments<textarea id="args">{}</textarea></label><button id="call" class="primary">Review and run once</button><pre id="result"></pre><iframe id="app" title="Isolated MCP App" hidden sandbox="allow-scripts"></iframe><pre id="events"></pre></div><div id="findings" hidden></div><div id="trace" hidden></div></section><p><a href="https://hellomcp.ai/validator">Use the full hosted workspace at HelloMCP</a></p></main><script type="module">
import {mountApp} from '/host.js';
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let report,cleanup;
const $=id=>document.getElementById(id);const api=async(path,data)=>{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-validator-token':token},body:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(b.error||'Request failed');return b};
function select(){const t=report.tools.find(t=>t.name===$('tools').value);$('schema').textContent=JSON.stringify(t,null,2);$('args').value='{}'}
$('connect').onsubmit=async e=>{e.preventDefault();$('status').textContent='Inspecting…';try{report=await api('/inspect',{url:$('url').value});$('workspace').hidden=false;$('tools').replaceChildren(...report.tools.map(t=>{const o=document.createElement('option');o.value=t.name;o.textContent=t.name;return o}));select();$('findings').replaceChildren(...report.findings.map(f=>{const a=document.createElement('article');a.textContent=f.outcome.toUpperCase()+' · '+f.title+' · '+f.subject+'\n'+f.evidence+' '+f.recommendation;return a}));$('trace').textContent=JSON.stringify(report.trace,null,2);$('status').textContent=`${report.tools.length} tools · ${report.resources.length} resources · ${report.protocolVersion} · ${report.complete?'Discovery complete':'Partial discovery'}`;}catch(e){$('status').textContent=e.message}};
$('tools').onchange=select;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>['inventory','findings','trace'].forEach(id=>$(id).hidden=id!==b.dataset.view));
async function call(name,args){if(!confirm('Run '+name+' once with these exact arguments?\n'+JSON.stringify(args)+'\nThis target may perform an external action.'))throw Error('Call cancelled');return api('/call',{name,arguments:args,approved:true})}
$('call').onclick=async()=>{try{const t=report.tools.find(t=>t.name===$('tools').value),input=JSON.parse($('args').value),result=await call(t.name,input);$('result').textContent=JSON.stringify(result,null,2);const uri=t._meta?.ui?.resourceUri;if(uri){const resource=await api('/read',{uri});const c=resource.contents.find(c=>c.uri===uri);if(c){cleanup?.();$('app').hidden=false;const html=c.text||atob(c.blob);cleanup=await mountApp({frame:$('app'),html,tool:t,arguments:input,result,tools:report.tools,profile:'standard',theme:'light',callTool:call,onEvent:e=>$('events').textContent+=JSON.stringify(e)+'\n'});$('status').textContent='App isolated. External network assets are blocked in the minimal local host; use self-contained resources.'}}}catch(e){$('status').textContent=e.message}};
</script></body></html>
